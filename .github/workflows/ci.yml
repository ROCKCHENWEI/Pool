name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Rust 共享核心编译和测试
  rust-core:
    name: Rust Core
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, beta]
        exclude:
          - os: ubuntu-latest
            rust: beta
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shared-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cd shared-core && cargo fmt --all -- --check
        continue-on-error: true

      - name: Run clippy
        run: cd shared-core && cargo clippy --all-targets --all-features -- -D warnings
        continue-on-error: true

      - name: Build
        run: cd shared-core && cargo build --verbose
        env:
          RUSTFLAGS: "-A dead_code"

      - name: Run tests
        run: cd shared-core && cargo test --verbose
        env:
          RUSTFLAGS: "-A dead_code"

      - name: Build documentation
        run: cd shared-core && cargo doc --no-deps
        continue-on-error: true

  # macOS Swift 应用编译
  macos-app:
    name: macOS App
    runs-on: macos-latest
    needs: rust-core
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build Rust shared core
        run: cd shared-core && cargo build --release

      - name: Setup Swift
        uses: swift-actions/setup-swift@v1
        with:
          swift-version: "5.9"

      - name: Build macOS app
        run: |
          cd apps/macos
          swift build 2>&1 || echo "Swift build requires Rust library linking"

  # 代码质量检查
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Security audit
        run: cd shared-core && cargo audit
        continue-on-error: true

      - name: Check for outdated dependencies
        run: cd shared-core && cargo outdated || true
        continue-on-error: true

  # 发布构建
  release-build:
    name: Release Build
    runs-on: ${{ matrix.os }}
    needs: [rust-core]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: libpool_core.so
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: libpool_core.dylib
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: |
          cd shared-core
          cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pool-core-${{ matrix.target }}
          path: shared-core/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          retention-days: 30

  # 测试覆盖率报告
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage report
        run: |
          cd shared-core
          cargo tarpaulin --out Xml --output-dir coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: shared-core/coverage/cobertura.xml
          fail_ci_if_error: false
        continue-on-error: true
